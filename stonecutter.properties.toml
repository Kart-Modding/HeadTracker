# See https://stonecutter.kikugie.dev/wiki/config/properties#centralized-properties
mod.id = "headtracker"
mod.name = "HeadTracker"
mod.group = "dev.karton.headtracker"
mod.version = "0.5.0"

# Project IDs for `publishMods` (see .github/workflows/build.yml). Leave one empty to skip that site.
publish.modrinth = "mBmenKIU"
publish.curseforge = "1625139"

deps.fabric_loader = "0.19.3"
loomx.loom_version = "1.17-SNAPSHOT"

# Sections:
#   ["<version>"]            - shared by every loader of that version
#   [<loader>."<version>"]   - loader-specific (mod.mc_compat uses that loader's range syntax)
# Forge versions are written as `<minecraft>-<forge>`, the way the Forge maven names them.

